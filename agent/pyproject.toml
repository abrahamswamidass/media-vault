[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediavault-agent"
version = "0.2.0"
description = "Local agent for Media Vault — the only component that touches your files"
requires-python = ">=3.11"

# The core connectors, actions, and CLI are standard library only, on purpose:
# the agent stays runnable on a bare Python with no install step. Everything in
# [project.optional-dependencies] enables one specific capability.
dependencies = []

[project.optional-dependencies]
imaging = ["Pillow>=10.0.0", "ImageHash>=4.3.1"]
metadata = ["PyExifTool>=0.5.6"]
drive = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]
cloud = ["google-cloud-firestore>=2.13.0", "google-cloud-storage>=2.12.0"]
dev = ["pytest>=8.0"]

[project.scripts]
mediavault = "mediavault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
