<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets content span under the notch/status bar on
       iOS — required for env(safe-area-inset-*) below to resolve to a real
       value instead of 0. Without it, the full-bleed mobile modal has no
       way to know how much to inset itself. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Media Vault</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icons/favicon.png" />

  <!-- "Add to Home Screen" support — Safari on iOS ignores manifest.json for
       the icon (unlike Chrome/Android), so apple-touch-icon is required
       separately even though it duplicates icons/icon-192.png below. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Media Vault" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header>
    <h1>Media Vault</h1>
    <p id="status">Loading…</p>
    <button id="signout-btn" hidden>Sign out</button>
  </header>
  <nav id="nav" hidden>
    <a href="#browse" data-view="browse">Browse</a>
    <a href="#map" data-view="map">Map</a>
    <a href="#duplicates" data-view="duplicates">Duplicates</a>
    <a href="#amazon" data-view="amazon">Amazon</a>
  </nav>
  <div id="signin" hidden>
    <button id="signin-btn">Sign in with Google</button>
  </div>
  <main id="view" hidden></main>
  <script type="module" src="app.js"></script>
</body>
</html>
