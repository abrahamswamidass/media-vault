# Builds the local agent into a container image you can pull and run at home.
name: agent

# Two jobs. Tests run on everything; the image is only built and published from
# main and from version tags, so a broken branch never becomes a pullable image.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'agent/**'
      - 'shared/**'
      - '.github/workflows/agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'shared/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:          # lets you rebuild on demand from the Actions tab

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------------ #
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: agent
        # The agent core is standard-library only; the extras pull in what the
        # imaging and cloud paths need so the whole suite runs, not just the core.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[imaging,dev]'

      - name: Run tests
        working-directory: agent
        run: python -m pytest tests/ -q

      - name: Validate shared contracts
        # Both modules read these; a malformed schema should fail here, not at runtime.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path('shared/contracts').glob('*.json')):
              try:
                  json.loads(p.read_text())
                  print(f'ok   {p}')
              except json.JSONDecodeError as e:
                  print(f'FAIL {p}: {e}'); bad += 1
          sys.exit(1 if bad else 0)
          PY

  # ------------------------------------------------------------------------ #
  image:
    name: build and publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        # GHCR rejects uppercase, and repository names often carry it.
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/agent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          # arm64 covers a Synology, a Pi, or an Apple-silicon host later on.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Agent image published"
            echo
            echo '```bash'
            echo "docker pull ${{ steps.img.outputs.name }}:latest"
            echo '```'
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
